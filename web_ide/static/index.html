<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEKOVA IDE — AI-Native Programming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg0:#080810;
  --bg1:#0e0e1a;
  --bg2:#13131f;
  --bg3:#1a1a2a;
  --bg4:#222235;
  --border:#ffffff0f;
  --border2:#ffffff18;
  --cyan:#00e5ff;
  --cyan2:#00b8d4;
  --cyan-dim:#00e5ff22;
  --green:#00ff88;
  --green-dim:#00ff8820;
  --red:#ff5370;
  --red-dim:#ff537020;
  --yellow:#ffcc02;
  --yellow-dim:#ffcc0220;
  --purple:#c792ea;
  --orange:#f78c6c;
  --pink:#ff5fa0;
  --text0:#eaeaf5;
  --text1:#a8a8c0;
  --text2:#606078;
  --font-mono:'JetBrains Mono',monospace;
  --font-ui:'Syne',sans-serif;
  --radius:6px;
  --radius-lg:10px;
}

body{
  font-family:var(--font-mono);
  background:var(--bg0);
  color:var(--text0);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ── SCANLINES OVERLAY ── */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events:none;
  z-index:9999;
}

/* ── HEADER ── */
.header{
  background:var(--bg1);
  border-bottom:1px solid var(--border);
  padding:0 16px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
  position:relative;
}

.header::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:0.4;
}

.logo{
  font-family:var(--font-ui);
  font-size:1.1rem;
  font-weight:800;
  letter-spacing:0.2em;
  color:var(--cyan);
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-badge{
  font-size:0.6rem;
  font-weight:600;
  letter-spacing:0.15em;
  color:var(--bg0);
  background:var(--cyan);
  padding:2px 7px;
  border-radius:3px;
  font-family:var(--font-ui);
}

.header-center{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:4px;
}

.tab{
  padding:5px 14px;
  font-size:0.72rem;
  color:var(--text2);
  border:1px solid transparent;
  border-radius:var(--radius);
  cursor:pointer;
  transition:all 0.15s;
  font-family:var(--font-mono);
  letter-spacing:0.05em;
  display:flex;
  align-items:center;
  gap:6px;
}

.tab:hover{color:var(--text1);border-color:var(--border2);}
.tab.active{
  color:var(--cyan);
  border-color:var(--cyan);
  background:var(--cyan-dim);
}

.tab-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--cyan);
  opacity:0;
  transition:opacity 0.15s;
}
.tab.modified .tab-dot{opacity:1;background:var(--yellow);}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.version-pill{
  font-size:0.65rem;
  color:var(--text2);
  border:1px solid var(--border2);
  padding:3px 9px;
  border-radius:20px;
  letter-spacing:0.1em;
}

.btn-icon{
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);
  border-radius:var(--radius);
  cursor:pointer;
  color:var(--text2);
  font-size:0.85rem;
  transition:all 0.15s;
  background:transparent;
}
.btn-icon:hover{color:var(--text0);border-color:var(--border2);background:var(--bg3);}

/* ── MAIN LAYOUT ── */
.main{
  display:flex;
  flex:1;
  overflow:hidden;
}

/* ── ACTIVITY BAR ── */
.activity-bar{
  width:44px;
  background:var(--bg1);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8px 0;
  gap:4px;
  flex-shrink:0;
}

.act-btn{
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius);
  cursor:pointer;
  color:var(--text2);
  font-size:1rem;
  transition:all 0.15s;
  position:relative;
}
.act-btn:hover{color:var(--text1);background:var(--bg3);}
.act-btn.active{color:var(--cyan);}
.act-btn.active::before{
  content:'';
  position:absolute;
  left:-8px;top:50%;transform:translateY(-50%);
  width:2px;height:16px;
  background:var(--cyan);
  border-radius:0 2px 2px 0;
}

.act-spacer{flex:1;}

/* ── SIDEBAR ── */
.sidebar{
  width:220px;
  background:var(--bg1);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  transition:width 0.2s;
  overflow:hidden;
}

.sidebar.collapsed{width:0;}

.sidebar-header{
  padding:10px 14px 8px;
  font-size:0.65rem;
  letter-spacing:0.15em;
  color:var(--text2);
  text-transform:uppercase;
  border-bottom:1px solid var(--border);
  font-family:var(--font-ui);
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.sidebar-section{overflow-y:auto;flex:1;}

.sidebar-group{
  padding:8px 0;
  border-bottom:1px solid var(--border);
}

.sidebar-group-title{
  padding:4px 14px;
  font-size:0.6rem;
  letter-spacing:0.12em;
  color:var(--text2);
  text-transform:uppercase;
  font-family:var(--font-ui);
  font-weight:600;
}

.file-item{
  padding:5px 14px 5px 24px;
  font-size:0.75rem;
  color:var(--text1);
  cursor:pointer;
  transition:all 0.1s;
  display:flex;
  align-items:center;
  gap:7px;
  border-left:2px solid transparent;
}
.file-item:hover{color:var(--text0);background:var(--bg3);}
.file-item.active{
  color:var(--cyan);
  border-left-color:var(--cyan);
  background:var(--cyan-dim);
}

.file-icon{font-size:0.7rem;opacity:0.6;}

.example-item{
  padding:5px 14px 5px 20px;
  font-size:0.73rem;
  color:var(--text1);
  cursor:pointer;
  transition:all 0.1s;
  border-left:2px solid transparent;
  display:flex;
  align-items:center;
  gap:7px;
}
.example-item:hover{color:var(--text0);background:var(--bg3);}

.cat-badge{
  font-size:0.55rem;
  padding:1px 5px;
  border-radius:3px;
  background:var(--bg4);
  color:var(--text2);
  letter-spacing:0.05em;
  margin-left:auto;
}
.cat-badge.ai{background:var(--cyan-dim);color:var(--cyan);}
.cat-badge.basics{background:var(--green-dim);color:var(--green);}
.cat-badge.stdlib{background:var(--yellow-dim);color:var(--yellow);}

/* ── EDITOR AREA ── */
.editor-area{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-width:0;
}

/* ── TOOLBAR ── */
.toolbar{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:6px 14px;
  display:flex;
  gap:6px;
  align-items:center;
  flex-shrink:0;
}

.btn-run{
  padding:5px 18px;
  background:var(--cyan);
  color:var(--bg0);
  border:none;
  border-radius:var(--radius);
  font-family:var(--font-mono);
  font-size:0.78rem;
  font-weight:700;
  cursor:pointer;
  transition:all 0.15s;
  letter-spacing:0.05em;
  display:flex;
  align-items:center;
  gap:6px;
}
.btn-run:hover{background:#33ecff;transform:translateY(-1px);}
.btn-run:active{transform:translateY(0);}
.btn-run:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

.btn-sm{
  padding:5px 12px;
  background:transparent;
  color:var(--text2);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  font-family:var(--font-mono);
  font-size:0.72rem;
  cursor:pointer;
  transition:all 0.15s;
}
.btn-sm:hover{color:var(--text0);border-color:var(--border2);background:var(--bg3);}

.toolbar-sep{
  width:1px;height:20px;
  background:var(--border);
  margin:0 4px;
}

.toolbar-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px;
}

.lang-indicator{
  font-size:0.65rem;
  color:var(--cyan);
  letter-spacing:0.1em;
  border:1px solid var(--cyan-dim);
  padding:2px 8px;
  border-radius:3px;
}

/* ── EDITOR SPLIT ── */
.split{
  flex:1;
  display:flex;
  overflow:hidden;
}

/* ── CODE EDITOR ── */
.editor-pane{
  flex:1;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--border);
  min-width:0;
  position:relative;
}

.editor-header{
  padding:5px 14px;
  font-size:0.65rem;
  letter-spacing:0.1em;
  color:var(--text2);
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:8px;
}

.editor-header span{color:var(--cyan);opacity:0.7;}

.editor-body{
  flex:1;
  display:flex;
  overflow:hidden;
  position:relative;
}

.line-numbers{
  padding:16px 0;
  min-width:46px;
  text-align:right;
  color:var(--text2);
  font-size:13px;
  line-height:1.7;
  -webkit-user-select:none;
  user-select:none;
  border-right:1px solid var(--border);
  background:var(--bg1);
  overflow:hidden;
  flex-shrink:0;
  padding-right:12px;
  padding-left:8px;
}

#editor{
  flex:1;
  background:var(--bg1);
  color:var(--text0);
  border:none;
  outline:none;
  padding:16px 20px;
  font-family:var(--font-mono);
  font-size:13px;
  line-height:1.7;
  resize:none;
  tab-size:4;
  white-space:pre;
  overflow-wrap:normal;
  overflow-x:auto;
  caret-color:var(--cyan);
}

#editor::selection{background:var(--cyan-dim);color:var(--text0);}

/* ── MINIMAP ── */
.minimap{
  width:80px;
  background:var(--bg0);
  border-left:1px solid var(--border);
  overflow:hidden;
  flex-shrink:0;
  opacity:0.4;
  position:relative;
}

.minimap canvas{width:100%;height:100%;}

/* ── OUTPUT PANEL ── */
.output-pane{
  width:360px;
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  background:var(--bg0);
}

.output-header{
  padding:5px 14px;
  font-size:0.65rem;
  letter-spacing:0.1em;
  color:var(--text2);
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.output-tabs{
  display:flex;
  gap:2px;
}

.output-tab{
  padding:2px 10px;
  font-size:0.65rem;
  color:var(--text2);
  cursor:pointer;
  border-radius:3px;
  transition:all 0.1s;
}
.output-tab:hover{color:var(--text1);}
.output-tab.active{color:var(--cyan);background:var(--cyan-dim);}

.output-time{
  font-size:0.6rem;
  color:var(--text2);
  font-family:var(--font-mono);
}

#output{
  flex:1;
  padding:16px;
  font-family:var(--font-mono);
  font-size:12.5px;
  line-height:1.75;
  overflow-y:auto;
  white-space:pre-wrap;
  word-break:break-word;
}

.out-default{color:var(--green);}
.out-error{color:var(--red);}
.out-info{color:var(--cyan);}
.out-dim{color:var(--text2);}
.out-think{color:var(--cyan);}
.out-system{color:var(--purple);}
.out-warning{color:var(--yellow);}

/* ── TERMINAL CURSOR BLINK ── */
.cursor-blink{
  display:inline-block;
  width:7px;height:13px;
  background:var(--cyan);
  animation:blink 1s step-end infinite;
  vertical-align:text-bottom;
  margin-left:2px;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── STATUS BAR ── */
.statusbar{
  height:24px;
  background:var(--cyan);
  color:var(--bg0);
  display:flex;
  align-items:center;
  padding:0 14px;
  font-size:0.65rem;
  letter-spacing:0.08em;
  font-family:var(--font-ui);
  font-weight:600;
  flex-shrink:0;
  gap:16px;
}

.status-item{display:flex;align-items:center;gap:4px;}
.status-right{margin-left:auto;display:flex;gap:16px;}

/* ── AUTOCOMPLETE ── */
.autocomplete{
  position:absolute;
  background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  z-index:100;
  min-width:160px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
  overflow:hidden;
  display:none;
}

.ac-item{
  padding:5px 12px;
  font-size:0.75rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  transition:background 0.1s;
}
.ac-item:hover,.ac-item.selected{background:var(--cyan-dim);color:var(--cyan);}
.ac-kind{
  font-size:0.6rem;
  color:var(--text2);
  margin-left:auto;
  font-style:italic;
}

/* ── LOADING ── */
.spinner{
  display:inline-block;
  width:10px;height:10px;
  border:2px solid var(--bg3);
  border-top-color:var(--bg0);
  border-radius:50%;
  animation:spin 0.5s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── NOTIFICATION ── */
.notif{
  position:fixed;
  bottom:40px;right:20px;
  background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:var(--radius-lg);
  padding:10px 16px;
  font-size:0.75rem;
  color:var(--text0);
  z-index:1000;
  transform:translateY(10px);
  opacity:0;
  transition:all 0.25s;
  pointer-events:none;
  display:flex;
  align-items:center;
  gap:8px;
}
.notif.show{transform:translateY(0);opacity:1;}
.notif.success{border-color:var(--green);color:var(--green);}
.notif.error{border-color:var(--red);color:var(--red);}

/* ── FIND BAR ── */
.find-bar{
  position:absolute;
  top:8px;right:8px;
  background:var(--bg3);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  padding:6px 10px;
  display:none;
  gap:8px;
  align-items:center;
  z-index:50;
  box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
.find-bar.show{display:flex;}
.find-bar input{
  background:var(--bg4);
  border:1px solid var(--border);
  border-radius:4px;
  color:var(--text0);
  font-family:var(--font-mono);
  font-size:0.75rem;
  padding:3px 8px;
  width:180px;
  outline:none;
}
.find-bar input:focus{border-color:var(--cyan);}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--border2);}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">
    NEKOVA
    <div class="logo-badge">IDE</div>
  </div>

  <div class="header-center">
    <div class="tab active" id="tab-editor" onclick="switchPanel('editor')">
      <div class="tab-dot"></div>
      editor
    </div>
    <div class="tab" id="tab-output" onclick="switchPanel('output')">
      output
    </div>
  </div>

  <div class="header-right">
    <div class="version-pill" id="version-label">v1.1.0</div>
    <div class="btn-icon" onclick="toggleFind()" title="Find (Ctrl+F)">Find</div>
    <div class="btn-icon" onclick="saveFile()" title="Save (Ctrl+S)">Save</div>
    <div class="btn-icon" onclick="toggleSidebar()" title="Sidebar">Menu</div>
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Activity Bar -->
  <div class="activity-bar">
    <div class="act-btn active" onclick="setActivity('files')" title="Files" id="act-files">F</div>
    <div class="act-btn" onclick="setActivity('examples')" title="Examples" id="act-examples">E</div>
    <div class="act-btn" onclick="setActivity('search')" title="Search" id="act-search">S</div>
    <div class="act-spacer"></div>
    <div class="act-btn" onclick="showSettings()" title="Settings">⚙</div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span id="sidebar-title">Files</span>
    </div>
    <div class="sidebar-section" id="sidebar-content"></div>
  </div>

  <!-- Editor Area -->
  <div class="editor-area">

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="btn-run" id="run-btn" onclick="runCode()">
        ▶ Run
      </button>
      <div class="toolbar-sep"></div>
      <button class="btn-sm" onclick="clearOutput()">Clear</button>
      <button class="btn-sm" onclick="copyCode()">Copy</button>
      <button class="btn-sm" onclick="formatCode()">Format</button>
      <div class="toolbar-sep"></div>
      <button class="btn-sm" onclick="newFile()">+ New</button>
      <div class="toolbar-right">
        <div class="lang-indicator">NEKOVA</div>
        <span style="font-size:0.65rem;color:var(--text2)" id="cursor-pos">Ln 1, Col 1</span>
      </div>
    </div>

    <!-- Editor + Output Split -->
    <div class="split">

      <!-- Code Editor Pane -->
      <div class="editor-pane">
        <div class="editor-header">
          <span>●</span>
          <span id="file-name" style="color:var(--text1)">untitled.nekova</span>
          <span style="margin-left:auto;color:var(--text2);font-size:0.6rem" id="char-count">0 chars</span>
        </div>

        <div class="editor-body">
          <div class="line-numbers" id="line-numbers">1</div>
          <textarea id="editor"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
            placeholder="# Write NEKOVA code here...
think &quot;What should I build today?&quot;"
          ></textarea>

          <!-- Find Bar -->
          <div class="find-bar" id="find-bar">
            <input type="text" id="find-input" placeholder="Find..." onkeydown="handleFind(event)">
            <button class="btn-sm" onclick="findNext()">↓</button>
            <button class="btn-sm" onclick="hideFindBar()">✕</button>
          </div>

          <!-- Autocomplete -->
          <div class="autocomplete" id="autocomplete"></div>
        </div>
      </div>

      <!-- Output Pane -->
      <div class="output-pane">
        <div class="output-header">
          <div class="output-tabs">
            <div class="output-tab active" onclick="switchOutputTab('terminal')">terminal</div>
            <div class="output-tab" onclick="switchOutputTab('problems')">problems</div>
          </div>
          <span class="output-time" id="exec-time"></span>
        </div>
        <div id="output">
          <span class="out-dim">┌─────────────────────────────────┐
│  NEKOVA IDE  ·  AI-Native Language │
│  Press ▶ Run or Ctrl+Enter       │
└─────────────────────────────────┘

</span><span class="cursor-blink"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Status Bar -->
<div class="statusbar">
  <div class="status-item">⬡ NEKOVA</div>
  <div class="status-item" id="status-msg">Ready</div>
  <div class="status-right">
    <div class="status-item" id="status-encoding">UTF-8</div>
    <div class="status-item" id="status-lines">1 line</div>
  </div>
</div>

<!-- Notification -->
<div class="notif" id="notif"></div>

<script>
// ── State ──────────────────────────────────────────────────────
let isRunning = false;
let currentFile = 'untitled.nekova';
let isModified = false;
let currentActivity = 'files';
let sidebarOpen = true;
let examples = [];
let acSuggestions = [];
let acIndex = -1;
let acVisible = false;
let findMatches = [];
let findMatchIndex = 0;

// ── NEKOVA Keywords for syntax-aware features ─────────────────────
const AI_KEYWORDS = new Set(['think','model','autonomous','parallel','memory','sandbox','strict','relaxed','pipeline','collect','generate','save','with','run']);
const CTRL_KEYWORDS = new Set(['if','else','repeat','while','for','in','return','try','catch']);
const DECL_KEYWORDS = new Set(['task','use','import']);
const SPECIAL = new Set(['show','true','false','null']);

// ── Init ────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadVersion();
  loadExamples();
  loadFiles();
  setActivity('examples');
  loadStarterCode();
  setupEditor();
});

function loadStarterCode() {
  const code = `# Welcome to NEKOVA Web IDE v2.0
# The AI-Native Programming Language

name = "Emmanuel"
language = "NEKOVA"

show "Hello, {name}!"
show "Welcome to {language} — where AI is syntax."

# Try the AI-native features:
# think "What should I build today?"
# model "gemini"
# "Analyze African tech" -> researcher -> writer`;
  document.getElementById('editor').value = code;
  updateLineNumbers();
  updateStats();
}

function setupEditor() {
  const ed = document.getElementById('editor');

  ed.addEventListener('input', () => {
    updateLineNumbers();
    updateStats();
    markModified();
    triggerAutocomplete();
  });

  ed.addEventListener('keydown', handleEditorKey);
  ed.addEventListener('click', updateCursorPos);
  ed.addEventListener('keyup', updateCursorPos);
  ed.addEventListener('scroll', syncScroll);
}

function syncScroll() {
  const ed = document.getElementById('editor');
  const ln = document.getElementById('line-numbers');
  ln.scrollTop = ed.scrollTop;
}

// ── Run Code ────────────────────────────────────────────────────
async function runCode() {
  if (isRunning) return;
  const code = document.getElementById('editor').value;
  if (!code.trim()) return;

  isRunning = true;
  setRunning(true);

  const out = document.getElementById('output');
  out.innerHTML = '<span class="out-dim">$ nekova run ' + currentFile + '\n\n</span>';

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({code})
    });
    const data = await res.json();

    if (data.error) {
      append('\n✗ Error\n', 'out-error');
      append('─'.repeat(40) + '\n', 'out-dim');
      append(data.error + '\n', 'out-error');
    } else if (data.output) {
      const lines = data.output.split('\n');
      lines.forEach(line => {
        if (line.startsWith('🧠')) {
          append(line + '\n', 'out-think');
        } else if (line.startsWith('✓') || line.startsWith('🤖') || line.startsWith('⚡')) {
          append(line + '\n', 'out-system');
        } else if (line.startsWith('✗') || line.includes('error')) {
          append(line + '\n', 'out-error');
        } else if (line.startsWith('💾') || line.startsWith('📥') || line.startsWith('📄')) {
          append(line + '\n', 'out-system');
        } else {
          append(line + '\n', 'out-default');
        }
      });
    } else {
      append('\n// No output\n', 'out-dim');
    }

    const t = data.time;
    document.getElementById('exec-time').textContent = t + 'ms';
    setStatus('Done in ' + t + 'ms');
    append('\n─'.repeat(40) + '\n', 'out-dim');
    append('✓ Finished in ' + t + 'ms\n', 'out-dim');

  } catch(err) {
    append('\n✗ Server error: ' + err.message + '\n', 'out-error');
    append('Is the NEKOVA server running?\n', 'out-dim');
  }

  isRunning = false;
  setRunning(false);
  out.scrollTop = out.scrollHeight;
}

function append(text, cls) {
  const out = document.getElementById('output');
  const span = document.createElement('span');
  span.className = cls || '';
  span.textContent = text;
  out.appendChild(span);
}

function clearOutput() {
  document.getElementById('output').innerHTML = '<span class="out-dim">// Output cleared\n</span><span class="cursor-blink"></span>';
  document.getElementById('exec-time').textContent = '';
}

// ── Running State ───────────────────────────────────────────────
function setRunning(running) {
  const btn = document.getElementById('run-btn');
  if (running) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Running';
    setStatus('Executing...');
  } else {
    btn.disabled = false;
    btn.innerHTML = '▶ Run';
  }
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

// ── Editor Keyboard ─────────────────────────────────────────────
function handleEditorKey(e) {
  const ed = e.target;

  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'Enter') { e.preventDefault(); runCode(); return; }
    if (e.key === 's') { e.preventDefault(); saveFile(); return; }
    if (e.key === 'f') { e.preventDefault(); toggleFind(); return; }
  }

  if (e.key === 'Tab') {
    e.preventDefault();
    if (acVisible && acIndex >= 0) {
      acceptAutocomplete();
      return;
    }
    const start = ed.selectionStart;
    const end = ed.selectionEnd;
    ed.value = ed.value.substring(0, start) + '    ' + ed.value.substring(end);
    ed.selectionStart = ed.selectionEnd = start + 4;
    updateLineNumbers();
    return;
  }

  if (e.key === 'Escape') { hideAutocomplete(); hideFindBar(); return; }

  if (e.key === 'ArrowDown' && acVisible) {
    e.preventDefault();
    acIndex = Math.min(acIndex + 1, acSuggestions.length - 1);
    renderAutocomplete();
    return;
  }
  if (e.key === 'ArrowUp' && acVisible) {
    e.preventDefault();
    acIndex = Math.max(acIndex - 1, -1);
    renderAutocomplete();
    return;
  }
  if (e.key === 'Enter' && acVisible && acIndex >= 0) {
    e.preventDefault();
    acceptAutocomplete();
    return;
  }

  if (e.key === 'Enter') {
    const start = ed.selectionStart;
    const lineStart = ed.value.lastIndexOf('\n', start - 1) + 1;
    const currentLine = ed.value.substring(lineStart, start);
    const indent = currentLine.match(/^(\s*)/)[1];
    const endsWithColon = currentLine.trimEnd().endsWith(':');
    const extraIndent = endsWithColon ? '    ' : '';
    e.preventDefault();
    const ins = '\n' + indent + extraIndent;
    ed.value = ed.value.substring(0, start) + ins + ed.value.substring(ed.selectionEnd);
    ed.selectionStart = ed.selectionEnd = start + ins.length;
    updateLineNumbers();
    updateStats();
    return;
  }
}

// ── Line Numbers ────────────────────────────────────────────────
function updateLineNumbers() {
  const ed = document.getElementById('editor');
  const ln = document.getElementById('line-numbers');
  const lines = ed.value.split('\n').length;
  let html = '';
  for (let i = 1; i <= lines; i++) {
    html += i + '\n';
  }
  ln.textContent = html;
}

// ── Stats ────────────────────────────────────────────────────────
function updateStats() {
  const code = document.getElementById('editor').value;
  const lines = code.split('\n').length;
  document.getElementById('char-count').textContent = code.length + ' chars';
  document.getElementById('status-lines').textContent = lines + (lines === 1 ? ' line' : ' lines');
}

function updateCursorPos() {
  const ed = document.getElementById('editor');
  const pos = ed.selectionStart;
  const text = ed.value.substring(0, pos);
  const lines = text.split('\n');
  const ln = lines.length;
  const col = lines[lines.length - 1].length + 1;
  document.getElementById('cursor-pos').textContent = 'Ln ' + ln + ', Col ' + col;
}

// ── Modified state ───────────────────────────────────────────────
function markModified() {
  isModified = true;
  const tab = document.getElementById('tab-editor');
  tab.classList.add('modified');
}

function markSaved() {
  isModified = false;
  const tab = document.getElementById('tab-editor');
  tab.classList.remove('modified');
}

// ── Autocomplete ─────────────────────────────────────────────────
async function triggerAutocomplete() {
  const ed = document.getElementById('editor');
  const pos = ed.selectionStart;
  const text = ed.value.substring(0, pos);
  const wordMatch = text.match(/[a-zA-Z_][a-zA-Z0-9_]*$/);
  if (!wordMatch || wordMatch[0].length < 2) { hideAutocomplete(); return; }
  const prefix = wordMatch[0];
  try {
    const res = await fetch('/api/complete', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prefix})
    });
    const data = await res.json();
    acSuggestions = data.suggestions || [];
    acIndex = -1;
    if (acSuggestions.length > 0) showAutocomplete(prefix);
    else hideAutocomplete();
  } catch(e) { hideAutocomplete(); }
}

function showAutocomplete(prefix) {
  const ed = document.getElementById('editor');
  const ac = document.getElementById('autocomplete');
  acVisible = true;
  renderAutocomplete();
  ac.style.display = 'block';
  const pos = getCaretCoords(ed);
  ac.style.left = pos.x + 'px';
  ac.style.top = (pos.y + 20) + 'px';
}

function renderAutocomplete() {
  const ac = document.getElementById('autocomplete');
  ac.innerHTML = acSuggestions.map((s, i) => {
    const kind = AI_KEYWORDS.has(s) ? 'ai' : CTRL_KEYWORDS.has(s) ? 'ctrl' : DECL_KEYWORDS.has(s) ? 'decl' : 'built-in';
    const cls = i === acIndex ? 'ac-item selected' : 'ac-item';
    return `<div class="${cls}" onclick="selectAc(${i})">
      <span>${s}</span>
      <span class="ac-kind">${kind}</span>
    </div>`;
  }).join('');
}

function selectAc(i) { acIndex = i; acceptAutocomplete(); }

function acceptAutocomplete() {
  if (acIndex < 0 || acIndex >= acSuggestions.length) return;
  const word = acSuggestions[acIndex];
  const ed = document.getElementById('editor');
  const pos = ed.selectionStart;
  const text = ed.value.substring(0, pos);
  const wordMatch = text.match(/[a-zA-Z_][a-zA-Z0-9_]*$/);
  if (!wordMatch) return;
  const start = pos - wordMatch[0].length;
  ed.value = ed.value.substring(0, start) + word + ed.value.substring(pos);
  ed.selectionStart = ed.selectionEnd = start + word.length;
  hideAutocomplete();
  updateLineNumbers();
}

function hideAutocomplete() {
  acVisible = false;
  acIndex = -1;
  document.getElementById('autocomplete').style.display = 'none';
}

function getCaretCoords(textarea) {
  const rect = textarea.getBoundingClientRect();
  const parent = textarea.parentElement.getBoundingClientRect();
  return { x: 60, y: 40 };
}

// ── Find ────────────────────────────────────────────────────────
function toggleFind() {
  const fb = document.getElementById('find-bar');
  if (fb.classList.contains('show')) {
    hideFindBar();
  } else {
    fb.classList.add('show');
    document.getElementById('find-input').focus();
  }
}

function hideFindBar() {
  document.getElementById('find-bar').classList.remove('show');
}

function handleFind(e) {
  if (e.key === 'Enter') findNext();
  if (e.key === 'Escape') hideFindBar();
}

function findNext() {
  const query = document.getElementById('find-input').value;
  if (!query) return;
  const ed = document.getElementById('editor');
  const text = ed.value;
  const start = ed.selectionEnd || 0;
  const idx = text.indexOf(query, start);
  if (idx >= 0) {
    ed.selectionStart = idx;
    ed.selectionEnd = idx + query.length;
    ed.focus();
    showNotif('Found at line ' + (text.substring(0, idx).split('\n').length), 'success');
  } else {
    const idx2 = text.indexOf(query, 0);
    if (idx2 >= 0) {
      ed.selectionStart = idx2;
      ed.selectionEnd = idx2 + query.length;
      ed.focus();
      showNotif('Wrapped to beginning', 'success');
    } else {
      showNotif('Not found: ' + query, 'error');
    }
  }
}

// ── File Operations ──────────────────────────────────────────────
async function saveFile() {
  const code = document.getElementById('editor').value;
  try {
    const res = await fetch('/api/save', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({filename: currentFile, code})
    });
    const data = await res.json();
    if (data.success) {
      markSaved();
      showNotif('Saved → ' + data.path, 'success');
      loadFiles();
    }
  } catch(e) {
    showNotif('Save failed', 'error');
  }
}

function newFile() {
  const name = prompt('File name:', 'untitled.nekova');
  if (!name) return;
  currentFile = name.endsWith('.nekova') ? name : name + '.nekova';
  document.getElementById('file-name').textContent = currentFile;
  document.getElementById('editor').value = '# ' + currentFile + '\n\n';
  updateLineNumbers();
  updateStats();
  markModified();
  showNotif('New file: ' + currentFile, 'success');
}

async function loadFiles() {
  try {
    const res = await fetch('/api/files');
    const data = await res.json();
    if (currentActivity === 'files') renderFiles(data.files);
  } catch(e) {}
}

function renderFiles(files) {
  const el = document.getElementById('sidebar-content');
  if (!files.length) {
    el.innerHTML = '<div style="padding:12px 14px;font-size:0.7rem;color:var(--text2)">No .nekova files found</div>';
    return;
  }
  el.innerHTML = '<div class="sidebar-group">' +
    '<div class="sidebar-group-title">examples/</div>' +
    files.map(f => `<div class="file-item ${f===currentFile?'active':''}" onclick="openFile('${f}')">
      <span class="file-icon">◈</span>${f}
    </div>`).join('') +
    '</div>';
}

async function openFile(filename) {
  try {
    const res = await fetch('/api/load', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({filename})
    });
    const data = await res.json();
    if (!data.error) {
      document.getElementById('editor').value = data.code;
      currentFile = filename;
      document.getElementById('file-name').textContent = filename;
      updateLineNumbers();
      updateStats();
      markSaved();
      showNotif('Opened: ' + filename, 'success');
      renderFiles(await (await fetch('/api/files')).json().then(d=>d.files));
    }
  } catch(e) {}
}

// ── Format ──────────────────────────────────────────────────────
async function formatCode() {
  const code = document.getElementById('editor').value;
  try {
    const res = await fetch('/api/format', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code})
    });
    const data = await res.json();
    if (!data.error && data.formatted !== code) {
      document.getElementById('editor').value = data.formatted;
      updateLineNumbers();
      showNotif('Code formatted', 'success');
    } else {
      showNotif('Already formatted', 'success');
    }
  } catch(e) {
    showNotif('Format unavailable', 'error');
  }
}

// ── Copy ────────────────────────────────────────────────────────
function copyCode() {
  const code = document.getElementById('editor').value;
  navigator.clipboard.writeText(code).then(() => {
    showNotif('Copied to clipboard!', 'success');
  });
}

// ── Examples ────────────────────────────────────────────────────
async function loadExamples() {
  try {
    const res = await fetch('/api/examples');
    const data = await res.json();
    examples = data.examples;
    if (currentActivity === 'examples') renderExamples();
  } catch(e) {}
}

function renderExamples() {
  const el = document.getElementById('sidebar-content');
  const groups = {};
  examples.forEach(ex => {
    const cat = ex.category || 'other';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(ex);
  });

  el.innerHTML = Object.entries(groups).map(([cat, items]) => `
    <div class="sidebar-group">
      <div class="sidebar-group-title">${cat}</div>
      ${items.map(ex => `
        <div class="example-item" onclick="loadExample(${JSON.stringify(ex).replace(/"/g,'&quot;')})">
          ${ex.name}
          <span class="cat-badge ${cat}">${cat}</span>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function loadExample(ex) {
  if (typeof ex === 'string') ex = JSON.parse(ex);
  document.getElementById('editor').value = ex.code;
  currentFile = ex.name.toLowerCase().replace(/\s+/g,'-') + '.nekova';
  document.getElementById('file-name').textContent = currentFile;
  updateLineNumbers();
  updateStats();
  clearOutput();
  showNotif('Loaded: ' + ex.name, 'success');
}

// ── Version ──────────────────────────────────────────────────────
async function loadVersion() {
  try {
    const res = await fetch('/api/version');
    const data = await res.json();
    document.getElementById('version-label').textContent = 'v' + data.version + ' · ' + data.codename;
  } catch(e) {}
}

// ── Activity Bar ─────────────────────────────────────────────────
function setActivity(name) {
  currentActivity = name;
  document.querySelectorAll('.act-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('act-' + name);
  if (btn) btn.classList.add('active');

  const title = document.getElementById('sidebar-title');
  const content = document.getElementById('sidebar-content');

  if (name === 'files') {
    title.textContent = 'Files';
    loadFiles();
  } else if (name === 'examples') {
    title.textContent = 'Examples';
    renderExamples();
  } else if (name === 'search') {
    title.textContent = 'Search';
    content.innerHTML = `
      <div style="padding:10px 12px">
        <input type="text" id="search-input" placeholder="Search in editor..."
          style="width:100%;background:var(--bg4);border:1px solid var(--border2);
          border-radius:var(--radius);color:var(--text0);font-family:var(--font-mono);
          font-size:0.75rem;padding:5px 10px;outline:none;"
          oninput="searchInEditor(this.value)"
          onkeydown="if(event.key==='Enter')findInEditor(this.value)">
      </div>
      <div id="search-results" style="padding:0 12px;font-size:0.72rem;color:var(--text2)">
        Type to search...
      </div>`;
    document.getElementById('search-input').focus();
  }

  if (!sidebarOpen) toggleSidebar();
}

function searchInEditor(query) {
  const results = document.getElementById('search-results');
  if (!query) { results.innerHTML = 'Type to search...'; return; }
  const code = document.getElementById('editor').value;
  const lines = code.split('\n');
  const matches = [];
  lines.forEach((line, i) => {
    if (line.toLowerCase().includes(query.toLowerCase())) {
      matches.push({line: i+1, text: line.trim()});
    }
  });
  if (!matches.length) {
    results.innerHTML = '<span style="color:var(--red)">No matches</span>';
    return;
  }
  results.innerHTML = matches.map(m =>
    `<div style="padding:4px 0;border-bottom:1px solid var(--border);cursor:pointer"
      onclick="gotoLine(${m.line})">
      <span style="color:var(--cyan)">${m.line}</span>
      <span style="color:var(--text1);margin-left:8px;font-size:0.7rem">${m.text.substring(0,40)}</span>
    </div>`
  ).join('');
}

function gotoLine(n) {
  const ed = document.getElementById('editor');
  const lines = ed.value.split('\n');
  let pos = 0;
  for (let i = 0; i < n-1; i++) pos += lines[i].length + 1;
  ed.selectionStart = ed.selectionEnd = pos;
  ed.focus();
}

// ── Sidebar ──────────────────────────────────────────────────────
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
}

// ── Panel Switch (mobile) ────────────────────────────────────────
function switchPanel(p) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + p).classList.add('active');
}

function switchOutputTab(tab) {
  document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

// ── Settings ─────────────────────────────────────────────────────
function showSettings() {
  showNotif('Settings coming soon', 'success');
}

// ── Notification ─────────────────────────────────────────────────
let notifTimer;
function showNotif(msg, type) {
  const n = document.getElementById('notif');
  n.textContent = msg;
  n.className = 'notif show ' + (type || '');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => n.classList.remove('show'), 2500);
}
</script>
