[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nekova-lang"
version = "1.8.0"
description = "NEKOVA - The AI-Native Programming Language by SYNEKCOT Tech"
authors = [
  {name = "Emmanuel King Christopher", email = "emmanuelkingchristopher@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["nekova", "programming-language", "ai", "ai-native", "synekcot", "nigeria"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Interpreters",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "colorama>=0.4.0",
  "python-dotenv>=0.19.0",
  "requests>=2.27.0",
  "flask>=2.0.0",
  "google-genai>=2.0.0",
  "anthropic>=0.20.0",
  "openai>=1.0.0",
  "edge-tts>=6.0.0",
  "pyttsx3>=2.90",
  "aiohttp>=3.9.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/kinghenesey/NEKOVA"
Repository = "https://github.com/kinghenesey/NEKOVA"
"Bug Tracker" = "https://github.com/kinghenesey/NEKOVA/issues"

[project.scripts]
nekova = "nekova_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nekova*"]
exclude = ["venv*", "tests*", "dist*", "build*", "*.egg-info*", "nekova-vscode*"]

[tool.setuptools]
py-modules = ["main", "runner", "nekova_cli", "repl", "debugger", "notebook", "formatter"]