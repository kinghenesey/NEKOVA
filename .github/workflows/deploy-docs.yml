name: Deploy NEKOVA Docs

# Builds docs-site/ with the Python static site generator and
# publishes the result to GitHub Pages, automatically, on every
# push to main that touches the docs site. Also runnable manually
# from the Actions tab (workflow_dispatch).

"on":
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: docs-site
        run: pip install -r requirements.txt

      - name: Build the site
        working-directory: docs-site
        run: python build.py

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4