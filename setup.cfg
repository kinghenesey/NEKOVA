[metadata]
name = aion-lang
version = 1.1.1
author = Emmanuel King Christopher
author_email = emmanuelkingchristopher@gmail.com
description = AION - AI-Native Programming Language with think, pipelines, vision, voice, memory and sandboxing
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/kinghenesey/AION
project_urls =
    Bug Tracker = https://github.com/kinghenesey/AION/issues
    Documentation = https://github.com/kinghenesey/AION#readme
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Software Development :: Interpreters
    Topic :: Software Development :: Compilers
    Topic :: Scientific/Engineering :: Artificial Intelligence
keywords = programming language, ai, interpreter, compiler, think, neural pipeline, multimodal, agent, vision, voice

[options]
packages = find:
python_requires = >=3.11
include_package_data = True
package_dir = =.
install_requires =
    colorama>=0.4.0
    python-dotenv>=0.19.0
    requests>=2.27.0
    flask>=2.0.0
    google-genai>=2.0.0
    anthropic>=0.20.0
    edge-tts>=6.0.0
    pyttsx3>=2.90

[options.packages.find]
where = .
exclude =
    venv*
    tests*
    dist*
    build*
    *.egg-info
    aion-vscode*
    examples*

[options.package_data]
* = *.py, *.json, *.cfg

[options.entry_points]
console_scripts =
    aion = aion_cli:main